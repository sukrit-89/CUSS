name: ReRail CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Linter (oxlint)
        run: bun run lint

      - name: Typecheck Frontend
        run: bun run build

      - name: Typecheck Serverless API
        run: bun run typecheck:api

  deploy-preview:
    name: Vercel Verification
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notice
        run: echo "PR validated cleanly. Ready for Vercel preview deployment."
